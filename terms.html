<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />

<title>Terms of Service — SprintLab · Moved</title>

<link rel="canonical" href="https://www.vyteralabs.com/sprintlab/terms/" />
<meta http-equiv="refresh" content="0; url=https://www.vyteralabs.com/sprintlab/terms/" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0B1017" />
<style>
  :root{--ink:#0B1017;--paper:#ECE6DA;--paper-dim:#AEB6C2;--muted:#6E7787;--brass:#C2A05B;
        --line:rgba(236,230,218,.22);
        --serif:Georgia,"Times New Roman",serif;
        --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
       background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.6;}
  main{max-width:34rem;text-align:center}
  .mark{width:34px;height:34px;margin:0 auto 26px;border:1px solid var(--brass);display:grid;
        place-items:center;font-family:var(--serif);font-size:19px;color:var(--brass);}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
           color:var(--brass);margin:0 0 18px;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;
     letter-spacing:-.02em;margin:0 0 18px;}
  p{color:var(--paper-dim);margin:0 0 26px;}
  a.go{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:14px;
       letter-spacing:.04em;padding:15px 26px;border:1px solid var(--line);color:var(--paper);
       text-decoration:none;}
  a.go:hover{border-color:var(--brass);background:rgba(194,160,91,.16);}
  a.go span{color:var(--brass)}
  .foot{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);margin:34px 0 0;}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="mark">V</div>
  <p class="eyebrow">SprintLab</p>
  <h1>This page has moved.</h1>
  <p>SprintLab's terms of service is now published by Vytera Labs at <strong>vyteralabs.com/sprintlab/</strong>, alongside its other apps. You should be redirected automatically.</p>
  <a class="go" href="https://www.vyteralabs.com/sprintlab/terms/">Continue to the terms of service <span>&rarr;</span></a>
  <p class="foot">&copy; 2026 Vytera Labs Ltd &middot; <a href="mailto:info@vyteralabs.com">info@vyteralabs.com</a></p>
</main>
<script>location.replace("https://www.vyteralabs.com/sprintlab/terms/");</script>
</body>
</html>
